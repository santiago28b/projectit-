# Example nginx reverse-proxy for Project It staging.
# One-time setup on EC2 (does not run from deploy scripts):
#
#   1. DNS: project-it.samirrodriguez.click → this instance
#   2. sudo cp scripts/nginx/project-it.samirrodriguez.click.conf \
#        /etc/nginx/conf.d/project-it.samirrodriguez.click.conf
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d project-it.samirrodriguez.click
#
# Certbot will rewrite listen/ssl lines; keep proxy_pass on port 4320.

server {
    server_name project-it.samirrodriguez.click;

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
}
